<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3상 부하불평형률 계산기</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-2 sm:p-4 flex flex-col items-center justify-center">

<div class="w-full max-w-xl bg-slate-850 bg-slate-850/90 bg-[#131c31] border border-slate-700/80 rounded-2xl shadow-2xl p-3 sm:p-4 space-y-3">
    
    <!-- Row 1: Header & Unit -->
    <div class="flex items-center justify-between border-b border-slate-700/70 pb-2">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold tracking-tight text-white">3상 부하불평형률 계산기</h1>
                <p class="text-[10px] text-slate-300">전기기사 실기 및 실무 기준 (KEC)</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <div class="inline-flex rounded-md bg-slate-700 p-0.5">
                <button id="unitAmp" onclick="setUnit('A')" class="px-2 py-0.5 text-[11px] font-bold rounded bg-blue-600 text-white transition">A</button>
                <button id="unitKw" onclick="setUnit('kW')" class="px-2 py-0.5 text-[11px] font-medium rounded text-slate-300 hover:text-white transition">kW</button>
            </div>
            <button onclick="openFormulaModal()" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded-md border border-slate-600 transition">공식</button>
        </div>
    </div>

    <!-- Row 2: Presets & Batch Toggle -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 bg-slate-800/60 px-2.5 py-1.5 rounded-lg border border-slate-700/60 text-xs">
        <div class="flex items-center gap-1">
            <span class="text-[10px] text-slate-300 font-medium">프리셋:</span>
            <button onclick="setPreset(50, 50, 50)" class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-[10px] py-0.5 px-1.5 rounded border border-slate-600 transition">평형(50)</button>
            <button onclick="setPreset(40, 50, 60)" class="bg-slate-700 hover:bg-slate-600 text-slate-100 text-[10px] py-0.5 px-1.5 rounded border border-slate-600 transition">양호(40/60)</button>
            <button onclick="setPreset(30, 50, 80)" class="bg-amber-900/40 text-amber-200 text-[10px] py-0.5 px-1.5 rounded border border-amber-700/50 transition">불평형</button>
        </div>
        <button onclick="toggleBatchInput()" class="text-[10px] text-blue-400 hover:text-blue-300 font-medium transition flex items-center gap-1">
            <span id="batchToggleText">일괄입력 열기</span>
        </button>
    </div>

    <!-- Batch Input Drawer -->
    <div id="batchInputContainer" class="hidden bg-slate-800 p-2.5 rounded-xl border border-blue-500/50 space-y-1.5">
        <label class="block text-[10px] font-medium text-blue-300">R, S, T 값을 공백이나 콤마로 구분 (예: 50 45 60)</label>
        <div class="flex gap-2">
            <input type="text" id="batchInputText" placeholder="50 45 60" class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500">
            <button onclick="applyBatchInput()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition">적용</button>
        </div>
    </div>

    <!-- Row 3: Phase Inputs -->
    <div class="space-y-1.5">
        <span class="text-xs font-bold text-slate-200 px-0.5 block">상별 수치 조작 (R, S, T)</span>
        <div class="grid grid-cols-3 gap-2.5">
            <!-- R Phase -->
            <div class="bg-slate-800 p-3.5 sm:p-4 rounded-2xl border border-slate-700 flex flex-col space-y-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <span class="w-6 h-6 rounded-lg bg-rose-500/25 text-rose-300 font-bold flex items-center justify-center text-xs border border-rose-500/40">R</span>
                    <span class="text-xs font-bold text-slate-200">R상</span>
                </div>
                <input type="number" id="inputR" value="50" step="any" oninput="syncInput('R')" class="w-full bg-slate-900 border border-slate-600 text-white text-center font-black
